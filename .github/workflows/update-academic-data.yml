name: Refresh academic publications and teaching
on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Refresh public academic records
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/update_academic_data.py
      - name: Validate metadata
        run: python scripts/update_academic_data.py --validate-only
      - name: Commit changed records
        run: |
          if git diff --quiet -- data/; then
            echo "No metadata changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m 'Refresh academic metadata'
          git push
